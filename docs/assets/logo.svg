<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background gradient: the zsuite tile -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>

    <!-- Zig orange: the zsuite Z -->
    <linearGradient id="zig" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7a41d"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>

    <!-- zlsp's own accent: violet, the editor's -->
    <linearGradient id="edit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="outerGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="blur" in2="SourceGraphic" operator="out" result="glowOut"/>
      <feMerge>
        <feMergeNode in="glowOut"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="64" fill="url(#bg)"/>

  <!-- The editor window -->
  <rect x="64" y="84" width="384" height="316" rx="20"
        fill="url(#edit)" fill-opacity="0.05"
        stroke="url(#edit)" stroke-width="4" stroke-opacity="0.55"
        filter="url(#glow)"/>
  <!-- its title bar -->
  <line x1="64" y1="122" x2="448" y2="122" stroke="url(#edit)" stroke-width="2" stroke-opacity="0.35"/>
  <g fill="url(#edit)">
    <circle cx="90" cy="103" r="6" opacity="0.8"/>
    <circle cx="112" cy="103" r="6" opacity="0.5"/>
    <circle cx="134" cy="103" r="6" opacity="0.3"/>
  </g>

  <!-- Line numbers in the gutter -->
  <g stroke="#ffffff" stroke-opacity="0.12" stroke-width="4" stroke-linecap="round">
    <line x1="86" y1="160" x2="98" y2="160"/>
    <line x1="86" y1="200" x2="98" y2="200"/>
    <line x1="86" y1="240" x2="98" y2="240"/>
    <line x1="86" y1="280" x2="98" y2="280"/>
    <line x1="86" y1="320" x2="98" y2="320"/>
    <line x1="86" y1="360" x2="98" y2="360"/>
  </g>

  <!-- Main "Z" letterform: the zsuite mark -->
  <g filter="url(#outerGlow)">
    <path d="
      M 130 152
      L 318 152
      L 318 178
      L 192 288
      L 318 288
      L 318 314
      L 130 314
      L 130 288
      L 256 178
      L 130 178
      Z
    " fill="url(#zig)"/>
  </g>

  <!-- The text cursor after it -->
  <line x1="338" y1="150" x2="338" y2="192" stroke="#a78bfa" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- A completion popup -->
  <g filter="url(#glow)">
    <rect x="300" y="238" width="128" height="104" rx="10" fill="#161b22" stroke="url(#edit)" stroke-width="3" stroke-opacity="0.8"/>
    <rect x="308" y="248" width="112" height="24" rx="6" fill="url(#edit)" fill-opacity="0.35"/>
  </g>
  <g stroke-linecap="round" stroke-width="5">
    <line x1="318" y1="260" x2="392" y2="260" stroke="#ffffff" stroke-opacity="0.85"/>
    <line x1="318" y1="292" x2="378" y2="292" stroke="#ffffff" stroke-opacity="0.3"/>
    <line x1="318" y1="322" x2="398" y2="322" stroke="#ffffff" stroke-opacity="0.3"/>
  </g>

  <!-- Code under the Z, a name underlined as a diagnostic -->
  <g stroke-linecap="round" stroke-width="5">
    <line x1="130" y1="352" x2="190" y2="352" stroke="#ffffff" stroke-opacity="0.18"/>
    <line x1="204" y1="352" x2="262" y2="352" stroke="#a78bfa" stroke-opacity="0.9"/>
  </g>
  <path d="M 204 366 q 5 -6 10 0 t 10 0 t 10 0 t 10 0 t 10 0 t 10 0"
        fill="none" stroke="#f87171" stroke-width="3" stroke-linecap="round" opacity="0.9"/>

  <!-- "lsp" text -->
  <text x="256" y="474" text-anchor="middle"
        font-family="'SF Mono', 'Fira Code', 'JetBrains Mono', monospace"
        font-size="58" font-weight="700" letter-spacing="8"
        fill="url(#edit)">lsp</text>

  <!-- A request, as a watermark -->
  <text x="256" y="58" text-anchor="middle"
        font-family="'SF Mono', 'Fira Code', monospace"
        font-size="11" fill="#ffffff" opacity="0.14"
        letter-spacing="1">"method": "textDocument/definition"</text>
</svg>
