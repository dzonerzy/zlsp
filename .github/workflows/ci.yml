name: CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_call:
    workflow_dispatch:

jobs:
    # One portable abi3 wheel per platform (cp310-abi3: CPython 3.10+). Both
    # are built on Linux: the Windows wheel is cross-compiled. The tests
    # below run each wheel on its own OS.
    build:
        name: Build wheel (${{ matrix.platform }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: Linux
                      target: ""
                    - platform: Windows
                      target: x86_64-windows
        steps:
            - uses: actions/checkout@v4

            # Also caches Zig's build cache, one per target
            - name: Setup Zig
              uses: mlugg/setup-zig@v2
              with:
                  version: 0.16.0
                  cache-key: ${{ matrix.platform }}

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.10"

            - name: Install PyOZ
              run: python -m pip install "pyoz>=0.13.10"

            - name: Build wheel
              run: pyoz build --release ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

            - name: Check the extension really uses the Stable ABI
              if: matrix.platform == 'Linux'
              run: |
                  unzip -o -q dist/*.whl zlsp.so -d /tmp/whl
                  nm -D /tmp/whl/zlsp.so | grep -q " U PyType_FromSpec" || { echo "not an abi3 build"; exit 1; }

            - uses: actions/upload-artifact@v4
              with:
                  name: wheel-${{ matrix.platform }}
                  path: dist/*.whl
                  if-no-files-found: error

    test:
        name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
        needs: build
        runs-on: ${{ matrix.os }}
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
                python-version: ["3.10", "3.12", "3.14"]
        steps:
            - uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}

            - uses: actions/download-artifact@v4
              with:
                  name: wheel-${{ runner.os }}
                  path: dist

            # A release takes a few minutes to reach every PyPI mirror pip may
            # ask: retry rather than fail on one that hasn't got it
            - name: Install zgram and zrules
              shell: bash
              # (--no-cache-dir: pip caches PyPI's index pages for 10 minutes, so
              # a retry would reread the page from before a fresh release)
              run: |
                  for i in $(seq 10); do
                      python -m pip install --no-cache-dir "zgram-py>=0.3.4" "zrules-py>=0.1.5" && exit 0
                      echo "retrying in 30 s"
                      sleep 30
                  done
                  exit 1

            - name: Install wheel
              shell: bash
              run: python -m pip install --no-deps dist/*.whl && python -m pip install pytest pytest-timeout

            - name: Run tests
              timeout-minutes: 10
              run: python -m pytest test -v -o faulthandler_timeout=120 --timeout=300

    # The server in a real VS Code: the extension template, its LSP client,
    # every feature asked of the editor (editors/vscode/test)
    vscode:
        name: VS Code
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - uses: actions/download-artifact@v4
              with:
                  name: wheel-Linux
                  path: dist

            - name: Install zlsp
              shell: bash
              run: |
                  for i in $(seq 10); do
                      python -m pip install --no-cache-dir "zgram-py>=0.3.4" "zrules-py>=0.1.5" && break
                      [ $i = 10 ] && exit 1
                      echo "retrying in 30 s"
                      sleep 30
                  done
                  python -m pip install --no-deps dist/*.whl

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Run the extension's tests in VS Code
              working-directory: editors/vscode
              run: |
                  npm ci
                  ZLSP_PYTHON="$(which python)" xvfb-run -a npm test

    # The server in a real Neovim, set up as the README says
    # (editors/neovim/test.lua)
    neovim:
        name: Neovim
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - uses: actions/download-artifact@v4
              with:
                  name: wheel-Linux
                  path: dist

            - name: Install zlsp
              shell: bash
              run: |
                  for i in $(seq 10); do
                      python -m pip install --no-cache-dir "zgram-py>=0.3.4" "zrules-py>=0.1.5" && break
                      [ $i = 10 ] && exit 1
                      echo "retrying in 30 s"
                      sleep 30
                  done
                  python -m pip install --no-deps dist/*.whl

            - name: Install Neovim
              run: |
                  curl -sL -o /tmp/nvim.tar.gz https://github.com/neovim/neovim/releases/download/v0.11.4/nvim-linux-x86_64.tar.gz
                  tar xzf /tmp/nvim.tar.gz -C /tmp

            - name: Run the session
              run: ZLSP_PYTHON="$(which python)" /tmp/nvim-linux-x86_64/bin/nvim --headless -u NONE -l editors/neovim/test.lua
