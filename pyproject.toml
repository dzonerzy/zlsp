[build-system]
requires = ["pyoz>=0.13.10"]
build-backend = "pyoz.backend"

[project]
# zsuite packages are named <name>-py on PyPI; the import name stays `zlsp` (module-name below)
name = "zlsp-py"
version = "0.1.2"
description = "A native Language Server Protocol server for any language defined with zgram and checked with zrules: diagnostics, navigation, rename, highlighting, completion."
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniele Linguaglossa" }]
keywords = ["lsp", "language-server", "editor", "ide", "dsl", "language", "zgram", "zrules"]
dependencies = ["zgram-py>=0.3.4", "zrules-py>=0.1.5"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Compilers",
    "Topic :: Text Editors :: Integrated Development Environments (IDE)",
]

[project.urls]
Homepage = "https://github.com/dzonerzy/zlsp"
Source = "https://github.com/dzonerzy/zlsp"
Issues = "https://github.com/dzonerzy/zlsp/issues"
Changelog = "https://github.com/dzonerzy/zlsp/blob/main/CHANGELOG.md"

[tool.pyoz]
# Path to your Zig source file
module-path = "src/lib.zig"

# Python import name (the distribution is zlsp-py)
module-name = "zlsp"

# Strip debug symbols in release builds
strip = true

# One wheel per platform for CPython 3.10+ (stable ABI)
abi3 = true
